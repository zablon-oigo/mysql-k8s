---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: adminer
  namespace: db
  labels:
    app: adminer
spec:
  replicas: 1

  selector:
    matchLabels:
      app: adminer

  template:
    metadata:
      labels:
        app: adminer

    spec:
      containers:
        - name: adminer
          image: adminer:latest
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 8080
              name: http

          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi

          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 20

---
apiVersion: v1
kind: Service
metadata:
  name: adminer
  namespace: db
spec:
  selector:
    app: adminer

  ports:
    - port: 8080
      targetPort: 8080

  type: ClusterIP
