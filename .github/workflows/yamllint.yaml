---
name: YAML Lint

'on':
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: YAML Lint
        uses: ibiqlik/action-yamllint@v3
        with:
          file_or_dir: .
          config_file: .yamllint

      - name: Install Helm
        uses: azure/setup-helm@v4
      
      - name: Helm lint
        run: helm lint ./mysql-chart
